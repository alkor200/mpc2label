[project]
name = "thermal-deck"
version = "0.1.0"
description = "Prints Phomemo M110 labels for every card in an MPC Autofill order.xml"
requires-python = ">=3.10"
dependencies = [
    "pyphomemo @ git+https://github.com/mkuhlmann/pyphomemo.git",
    "gdown>=5.2",
]

[project.scripts]
thermal-deck = "thermal_deck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
